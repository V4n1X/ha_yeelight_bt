name: Privacy

on:
  push:
  pull_request:
  # full history scan
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  personal-data:
    name: No personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check all files
        run: python scripts/check_private_data.py --all-files

      - name: Check the pushed commits (incl. messages and authors)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_private_data.py --range "${{ github.event.before }}..${{ github.sha }}"

      - name: Check the commits of the pull request
        if: github.event_name == 'pull_request'
        run: python scripts/check_private_data.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
