name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r '.version' custom_components/yeelight_bt/manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build the ZIP for manual installation
        run: |
          cd custom_components/yeelight_bt
          zip -r "$GITHUB_WORKSPACE/yeelight_bt.zip" . -x "__pycache__/*"

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" yeelight_bt.zip --clobber
