name: Bug report
description: Something does not work as expected
title: "[Bug] <title>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please check the [troubleshooting section](https://github.com/V4n1X/ha_yeelight_bt#troubleshooting) first.
  - type: dropdown
    id: light_type
    attributes:
      label: Lamp
      options:
        - Yeelight Bedside
        - Yeelight Candela
        - Both
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: ex. v2.0.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: ex. 2026.11.0
    validations:
      required: true
  - type: dropdown
    id: ha_type
    attributes:
      label: Installation type
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Core
        - Other
    validations:
      required: true
  - type: dropdown
    id: bluetooth_connection
    attributes:
      label: Bluetooth connection
      description: How does Home Assistant reach the lamp?
      options:
        - Local bluetooth adapter
        - ESPHome bluetooth proxy
        - Shelly bluetooth proxy
        - Other / several
    validations:
      required: true
  - type: textarea
    id: issue_txt
    attributes:
      label: Describe the issue
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The lamp is not connected to the Yeelight app or another device.
          required: true
        - label: I enabled debug logging for the integration and attached the log below.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Settings → Devices & services → Yeelight Bluetooth → ⋮ → Enable debug logging, reproduce the problem, then disable it again to download the log.
      render: text
